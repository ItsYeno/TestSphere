name: HSE agent · golden questions
description: Safety-critical questions the HSE agent must answer from approved HSE procedures.
target: hse
tags: [agents, hse, pre-deployment]

cases:
  - name: Permit to work
    ask: Can maintenance work start without a permit to work?
    expect:
      mentions: [permit to work]
      cites: [Permit to Work]
      grounded: true

  - name: Gas test interval during hot work
    ask: How often must gas testing be repeated during hot work?
    expect:
      mentions: [every 2 hours]
      cites: [Gas Testing]
      grounded: true
