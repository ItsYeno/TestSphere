version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: testsphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - testsphere-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: testsphere
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: your-production-jwt-secret
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./storage/uploads:/app/storage/uploads
    networks:
      - testsphere-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - testsphere-network

volumes:
  postgres_data:

networks:
  testsphere-network:
    driver: bridge